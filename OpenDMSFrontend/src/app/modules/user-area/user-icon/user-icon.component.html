<button mat-icon-button matTooltip="{{this.userName}}" [matMenuTriggerFor]="menu">
    <mat-icon>
        account_circle
    </mat-icon>
</button>
<mat-menu #menu="matMenu">
    <span i18n="@@hello_user">Hello {{this.userName}}</span>
    <button mat-menu-item (click)="logout()" i18n="@@logout">Logout</button>
</mat-menu>
