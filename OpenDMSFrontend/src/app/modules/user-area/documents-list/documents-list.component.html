<app-frame-work>
    <app-user-area-container>
        <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="center">
            <mat-tab label="Latest documents">
                <app-document-table [documents$]="latestDocuments$"></app-document-table>
            </mat-tab>
            <mat-tab label="All documents">
                <app-content-tree></app-content-tree>
            </mat-tab>
        </mat-tab-group>
    </app-user-area-container>
</app-frame-work>
