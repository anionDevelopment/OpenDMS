<mat-form-field>
    <mat-label>Search term</mat-label>
    <input matInput [(ngModel)]='searchText' (keydown.enter)="search()">
</mat-form-field>
<button mat-button type="submit" (click)="search()" [disabled]="!searchText || searchText.trim() === ''">
    <mat-icon>search</mat-icon>
</button>
<app-document-table [documents$]="documents$" (documentRemoved)="onDocumentRemoved($event)"></app-document-table>
