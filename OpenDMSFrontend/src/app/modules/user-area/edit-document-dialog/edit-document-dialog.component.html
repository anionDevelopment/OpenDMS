<h2 mat-dialog-title i18n="@@edit_document_dialog_title">Edit document</h2>
<mat-dialog-content>
  <mat-form-field >
    <mat-label i18n="@@doc_title_label">Title</mat-label>
    <input matInput [(ngModel)]="documentTitle">
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="abort()" i18n="@@abort">Abort</button>
  <button mat-button (click)="save()" i18n="@@save">Save</button>
</mat-dialog-actions>
