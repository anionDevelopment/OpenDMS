<h2 mat-dialog-title>Edit document</h2>
<mat-dialog-content>
  <mat-form-field >
    <mat-label>Title</mat-label>
    <input matInput [(ngModel)]="documentTitle">
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="abort()">Abort</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
