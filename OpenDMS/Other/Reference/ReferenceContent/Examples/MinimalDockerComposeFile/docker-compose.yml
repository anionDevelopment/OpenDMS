services:
  opendms:
    container_name: opendms
    env_file: Variables.env
    image: opendms:1.0.1
    ports:
    - 443:443
    volumes:
    - ./Volumes/Data:/Workspace/Data
    - ./Volumes/Configuration:/Workspace/Configuration
    - ./Volumes/Logs:/Workspace/Logs
  opendms_database:
    container_name: opendms_database
    environment:
      MARIADB_DATABASE: OpenDMSDatabase
      MARIADB_ROOT_HOST: '%'
      MARIADB_ROOT_PASSWORD: R00tpa55w0rd
    image: mariadb:11.7.2
    ports:
    - 3306:3306
    volumes:
    - ./Volumes/Data:/var/lib/mysql
  opendms_database_administration:
    container_name: opendms_database_administration
    depends_on:
    - opendms_database
    image: adminer:4.17.1
    ports:
    - 8080:8080
version: '3.2'
