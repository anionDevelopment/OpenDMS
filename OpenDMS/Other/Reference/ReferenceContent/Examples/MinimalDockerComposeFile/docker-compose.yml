services:
  opendms:
    container_name: opendms
    env_file: Variables.env
    image: opendms:3.0.4
    ports:
    - 443:443
    volumes:
    - ./Volumes/opendms/Data:/Workspace/Data
    - ./Volumes/opendms/Configuration:/Workspace/Configuration
    - ./Volumes/opendms/Logs:/Workspace/Logs
  opendms_database:
    container_name: opendms_database
    environment:
      POSTGRES_DB: OpenDMSDatabase
      POSTGRES_PASSWORD: pa55w0rd
      POSTGRES_USER: user
    image: ${image_postgres}
    ports:
    - 5432:5432
    volumes:
    - ./Volumes/opendms_database/Data:/var/lib/postgresql/data
  opendms_database_administration:
    container_name: opendms_database_administration
    depends_on:
    - opendms_database
    image: ${image_adminer}
    ports:
    - 8080:8080
  simpleocr:
    container_name: simpleocr
    image: ${image_simpleocr}
    ports:
    - 448:443
    volumes:
    - ./Volumes/simpleocr/Configuration:/Workspace/Configuration
    - ./Volumes/simpleocr/Logs:/Workspace/Logs
