services:
  opendms:
    container_name: opendms
    env_file: Variables.env
    image: opendms:1.1.5
    ports:
    - 443:443
    volumes:
    - ./Volumes/Data:/Workspace/Data
    - ./Volumes/Configuration:/Workspace/Configuration
    - ./Volumes/Logs:/Workspace/Logs
  opendms_database:
    container_name: opendms_database
    image: postgres:17.5
    environment:
      POSTGRES_PASSWORD: R00tpa55w0rd
      POSTGRES_DB: OpenDMSDatabase
    ports:
      - "5432:5432"
    volumes:
      - ./Volumes/Data:/var/lib/postgresql/data
  opendms_database_administration:
    container_name: opendms_database_administration
    depends_on:
    - opendms_database
    image: adminer:4.17.1
    ports:
    - 8080:8080a
