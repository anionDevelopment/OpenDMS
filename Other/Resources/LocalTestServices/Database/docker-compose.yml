version: "3.2"

services:
  opendmsbackend_database:
    # connectionstring: "Server=OpenDMSbackend_database; Port=3306; Database=OpenDMSBackendDatabase; Uid=user; Pwd=pa55w0rd;"
    # direct local connection: "mariadb -u root -pR00tpa55w0rd OpenDMSBackendDatabase"
    image: mariadb:11.5.2
    container_name: "opendmsbackend_database"
    ports:
      - "3306:3306"
    # Encomment the following 2 lines if the test-database is supposed to be persistent for test-purposes
    #   volumes:
    #     - "./Volumes/Data:/var/lib/mysql"
    environment:
      MARIADB_USER: user
      MARIADB_PASSWORD: pa55w0rd
      MARIADB_ROOT_PASSWORD: R00tpa55w0rd
      MARIADB_DATABASE: OpenDMSBackendDatabase
    networks:
      - opendms_net

  opendmsbackend_database_administration:
    image: adminer:4.8.1
    container_name: "opendmsbackend_database_administration"
    ports:
      - 8080:8080
    depends_on:
      - opendmsbackend_database
    networks:
      - opendms_net

networks:
  opendms_net:
    external: true
