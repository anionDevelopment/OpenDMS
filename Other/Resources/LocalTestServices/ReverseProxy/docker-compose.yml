services:
  opendms_reverseproxy:
    image: nginx:1.27.4
    container_name: "opendms_reverseproxy"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - "../../DevelopmentCertificate:/Workspace/Certificates"
    ports:
      - "443:443"
    networks:
      - opendms_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  opendms_net:
    external: true
