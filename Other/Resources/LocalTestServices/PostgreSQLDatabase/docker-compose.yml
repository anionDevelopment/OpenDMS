services:

  opendms_database:
    container_name: "opendms_database"
    image: ${image_postgresql}
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pa55w0rd
      POSTGRES_DB: OpenDMSDatabase
      PGDATA: /var/lib/postgresql/data
    expose:
      - "5432"
    volumes:
      - ./Volumes/OpenDMSPostgreSQLData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U user -d OpenDMSDatabase || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    networks:
      - opendms_net
    command: >
      postgres -c log_connections=on -c log_disconnections=on

  opendms_database_administration:
    image: ${image_adminer}
    container_name: "opendms_database_administration"
    expose:
      - "8080"
    depends_on:
      - opendms_database
    networks:
      - opendms_net

networks:
  opendms_net:
    external: true
