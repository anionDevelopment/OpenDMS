services:

  opendms_database:
    container_name: "opendms_database"
    image: ${image_postgres}:17.7
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pa55w0rd
      POSTGRES_DB: OpenDMSDatabase
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - ./Volumes/OpenDMSPostgreSQLData:/var/lib/postgresql/data
    networks:
      - opendms_net
    command: >
      postgres -c log_connections=on -c log_disconnections=on

  opendms_database_administration:
    image: ${image_adminer}:5.4.1
    container_name: "opendms_database_administration"
    ports:
      - 8080:8080
    depends_on:
      - opendms_database
    networks:
      - opendms_net

networks:
  opendms_net:
    external: true
