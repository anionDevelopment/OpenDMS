components:
  schemas:
    AccessToken:
      additionalProperties: false
      properties:
        expiredMoment:
          format: date-time
          type: string
        ownerUserId:
          nullable: true
          type: string
        value:
          nullable: true
          type: string
      type: object
    DocumentDTO:
      additionalProperties: false
      description: Represents a data transfer object for a full document, including
        its content.
      properties:
        addedByUserId:
          nullable: true
          type: string
        assignedLanguages:
          items:
            type: string
          nullable: true
          type: array
          uniqueItems: true
        deleteIsNotAllowedBefore:
          nullable: true
          type: string
        documentContentAsBase64:
          nullable: true
          type: string
        documentPreviewAsBase64:
          nullable: true
          type: string
        filename:
          nullable: true
          type: string
        groupOfBusinessOwner:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        importDate:
          nullable: true
          type: string
        isSoftDeleted:
          type: boolean
        lastEditDate:
          nullable: true
          type: string
        mimeType:
          nullable: true
          type: string
        mustBeHardDeletedAfter:
          nullable: true
          type: string
        originalFilename:
          nullable: true
          type: string
        readableId:
          format: int64
          type: integer
        tags:
          items:
            $ref: '#/components/schemas/TagDTO'
          nullable: true
          type: array
          uniqueItems: true
        title:
          nullable: true
          type: string
        version:
          $ref: '#/components/schemas/Version3'
      type: object
    DocumentPreviewDTO:
      additionalProperties: false
      description: Represents a data transfer object for a document preview, without
        the full document content.
      properties:
        addedByUserId:
          nullable: true
          type: string
        assignedLanguages:
          items:
            type: string
          nullable: true
          type: array
          uniqueItems: true
        deleteIsNotAllowedBefore:
          nullable: true
          type: string
        filename:
          nullable: true
          type: string
        groupOfBusinessOwner:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        importDate:
          nullable: true
          type: string
        isSoftDeleted:
          type: boolean
        lastEditDate:
          nullable: true
          type: string
        mimeType:
          nullable: true
          type: string
        mustBeHardDeletedAfter:
          nullable: true
          type: string
        originalFilename:
          nullable: true
          type: string
        previewAsBase64:
          nullable: true
          type: string
        readableId:
          format: int64
          type: integer
        title:
          nullable: true
          type: string
        version:
          $ref: '#/components/schemas/Version3'
      type: object
    FolderDTO:
      additionalProperties: false
      properties:
        containedDocumentIds:
          items:
            type: string
          nullable: true
          type: array
        containedFolderIds:
          items:
            type: string
          nullable: true
          type: array
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    OIDCCallbackRequestDTO:
      additionalProperties: false
      description: Sent by the frontend to exchange an OIDC authorization code for
        an OpenDMS access token.
      properties:
        code:
          description: The authorization code received from the OIDC provider callback.
          nullable: true
          type: string
        providerId:
          description: The provider id that initiated the flow (e.g. "keycloak-1").
          nullable: true
          type: string
        state:
          description: The state value from the callback, used to look up the stored
            code verifier.
          nullable: true
          type: string
      type: object
    OIDCInitiationDTO:
      additionalProperties: false
      description: Returned when initiating an OIDC login; the frontend redirects
        the user to OpenDMSBackend.Core.Model.DTOs.OIDCInitiationDTO.AuthorizationUrl.
      properties:
        authorizationUrl:
          description: The full URL to redirect the user's browser to at the OIDC
            provider.
          nullable: true
          type: string
        state:
          description: "The OIDC state value. The frontend must store this and verify\
            \ it matches what comes back\r\nin the callback query parameter before\
            \ calling ExchangeOIDCCode."
          nullable: true
          type: string
      type: object
    OIDCProviderDTO:
      additionalProperties: false
      description: Public representation of a configured OIDC provider, returned to
        the frontend.
      properties:
        displayName:
          description: The human-readable label for the login button.
          nullable: true
          type: string
        id:
          description: The unique provider id (e.g. "keycloak-1").
          nullable: true
          type: string
      type: object
    ProblemDetails:
      additionalProperties: {}
      properties:
        detail:
          nullable: true
          type: string
        instance:
          nullable: true
          type: string
        status:
          format: int32
          nullable: true
          type: integer
        title:
          nullable: true
          type: string
        type:
          nullable: true
          type: string
      type: object
    StorageLocationDTO:
      additionalProperties: false
      properties:
        containedDocumentIds:
          items:
            type: string
          nullable: true
          type: array
        containedFolderIds:
          items:
            type: string
          nullable: true
          type: array
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    StringValueDTO:
      additionalProperties: false
      properties:
        value:
          nullable: true
          type: string
      type: object
    TagDTO:
      additionalProperties: false
      properties:
        colorCode:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    UserInformationDTO:
      additionalProperties: false
      properties:
        id:
          nullable: true
          type: string
        isAdmin:
          type: boolean
        name:
          nullable: true
          type: string
      type: object
    Version3:
      additionalProperties: false
      properties:
        major:
          format: int64
          type: integer
        minor:
          format: int64
          type: integer
        patch:
          format: int64
          type: integer
      type: object
info:
  description: OpenDMSBackend is the backend of OpenDMS.
  title: OpenDMSBackend v3.1.0 API documentation
  version: v3.1.0
openapi: 3.0.4
paths:
  /API/Other/Maintenance/AvailabilityCheck:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/CurrentVersion:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/HealthCheck:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/InitializationState:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/Metrics:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/ShowAllEndpoints:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/v3/OIDCController/ExchangeOIDCCode:
    post:
      requestBody:
        content:
          application/*+json:
            schema:
              $ref: '#/components/schemas/OIDCCallbackRequestDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCCallbackRequestDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/OIDCCallbackRequestDTO'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
            text/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
            text/plain:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Bad Request
      summary: "Exchanges the OIDC authorization code for an OpenDMS access token.\r\
        \nCreates a new OpenDMS account for the user on their first login via this\
        \ provider."
      tags:
      - OIDC
  /API/v3/OIDCController/GetOIDCProviders:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OIDCProviderDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OIDCProviderDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OIDCProviderDTO'
                type: array
          description: OK
      summary: Returns the list of configured OIDC providers. An empty list means
        OIDC login is not available.
      tags:
      - OIDC
  /API/v3/OIDCController/InitiateOIDCLogin:
    get:
      parameters:
      - description: The id of the OIDC provider (e.g. "keycloak-1").
        in: query
        name: providerId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCInitiationDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/OIDCInitiationDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/OIDCInitiationDTO'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not Found
      summary: Initiates an OIDC login for the specified provider. Returns the authorization
        URL to redirect the user to.
      tags:
      - OIDC
  /API/v3/OpenDMSBackend/AddDocument/{containerId}:
    post:
      parameters:
      - description: The ID of the container (folder or storage location) to add the
          document to.
        in: path
        name: containerId
        required: true
        schema:
          type: string
      - description: The file name for the uploaded document.
        in: query
        name: filename
        schema:
          type: string
      - description: An optional display title for the document.
        in: query
        name: title
        schema:
          type: string
      - description: Additional languages to use during OCR processing.
        in: query
        name: additionalOCRLanguages
        schema:
          items:
            type: string
          type: array
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              format: byte
              type: string
          application/json:
            schema:
              format: byte
              type: string
          application/octet-stream:
            schema:
              format: byte
              type: string
          text/json:
            schema:
              format: byte
              type: string
        description: The raw binary content of the document.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Uploads a new document into the specified container.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AddFolder/{parentFolderId}/{name}:
    post:
      parameters:
      - description: The ID of the parent folder in which to create the new folder.
        in: path
        name: parentFolderId
        required: true
        schema:
          type: string
      - description: The name of the new folder.
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Creates a new folder inside the specified parent folder.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AddStorageLocation/{name}:
    post:
      parameters:
      - description: The display name of the new storage location.
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Creates a new storage location with the given name owned by the current
        user.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AuthorizeUserToViewStorageLocation/{storageLocationId}/{sharedWithUserId}:
    post:
      parameters:
      - description: The id of the storage location to share.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: The id of the user to grant access to.
        in: path
        name: sharedWithUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Grants the specified user permission to view the specified storage
        location.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetAllTags:
    put:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/TagDTO'
                type: array
          description: OK
      summary: Returns all tags defined in the system.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetAllViewableStorageLocations:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StorageLocationDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/StorageLocationDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/StorageLocationDTO'
                type: array
          description: OK
      summary: Returns all storage locations the current user is allowed to view.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetDocument:
    get:
      parameters:
      - description: The id of the document to retrieve.
        in: query
        name: id
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
          description: OK
      summary: Returns the full document with the specified id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetDocumentFromReadableId:
    get:
      parameters:
      - description: The human-readable numeric id of the document to retrieve.
        in: query
        name: readableId
        schema:
          format: int32
          type: integer
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
          description: OK
      summary: Returns the full document identified by its human-readable numeric
        id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetDocumentPreview:
    get:
      parameters:
      - description: The id of the document whose preview is requested.
        in: query
        name: id
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentPreviewDTO'
          description: OK
      summary: Returns a preview representation of the document with the specified
        id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetFolder/{id}:
    get:
      parameters:
      - description: The id of the folder to retrieve.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/FolderDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/FolderDTO'
          description: OK
      summary: Returns the folder with the specified id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetLatestDocuments:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
          description: OK
      summary: Returns the most recently added documents visible to the current user.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetStorageLocation/{id}:
    get:
      parameters:
      - description: The id of the storage location to retrieve.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/StorageLocationDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/StorageLocationDTO'
          description: OK
      summary: Returns the storage location with the specified id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/HardDelete/{containerOrContaineeId}:
    delete:
      parameters:
      - description: The id of the container or document to delete.
        in: path
        name: containerOrContaineeId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
        description: The stated reason for the deletion, recorded in the audit log.
      responses:
        '200':
          description: OK
      summary: Permanently deletes the specified container or document and all its
        contents.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/Move/{containeeIdToMove}/{targetContainerId}:
    post:
      parameters:
      - description: The id of the document or folder to move.
        in: path
        name: containeeIdToMove
        required: true
        schema:
          type: string
      - description: The id of the container to move the item into.
        in: path
        name: targetContainerId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Moves the specified containee into the target container.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/Rename/{containerId}/{newName}:
    post:
      parameters:
      - description: The id of the container to rename.
        in: path
        name: containerId
        required: true
        schema:
          type: string
      - description: The new name to assign.
        in: path
        name: newName
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Renames the specified container to the given new name.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/Search:
    get:
      parameters:
      - description: The term to search for across document titles, filenames, tags,
          and OCR content.
        in: query
        name: searchTerm
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
          description: OK
      summary: Searches for documents visible to the current user that match the given
        search term.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/SoftDelete/{containerOrContaineeId}:
    delete:
      parameters:
      - description: The id of the container or document to soft-delete.
        in: path
        name: containerOrContaineeId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
        description: The stated reason for the deletion, recorded in the audit log.
      responses:
        '200':
          description: OK
      summary: Marks the specified container or document as soft-deleted without removing
        it from storage.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/UnauthorizeUserToViewStorageLocation/{storageLocationId}/{sharedWithUserId}:
    post:
      parameters:
      - description: The id of the storage location.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: The id of the user whose access should be revoked.
        in: path
        name: sharedWithUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Revokes the specified user's permission to view the specified storage
        location.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/UpdateDocumentTitle/{documentId}:
    put:
      parameters:
      - description: The ID of the document whose title should be updated.
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
