components:
  schemas:
    AccessToken:
      additionalProperties: false
      properties:
        expiredMoment:
          format: date-time
          type: string
        ownerUserId:
          nullable: true
          type: string
        value:
          nullable: true
          type: string
      type: object
    DocumentDTO:
      additionalProperties: false
      description: Represents a data transfer object for a full document, including
        its content.
      properties:
        addedByUserId:
          nullable: true
          type: string
        aiSummaryLong:
          description: A regular AI-generated summary, or null if none has been generated
            yet.
          nullable: true
          type: string
        aiSummaryShort:
          description: A very short AI-generated summary (at most three sentences),
            or null if none has been generated yet.
          nullable: true
          type: string
        assignedLanguages:
          items:
            type: string
          nullable: true
          type: array
          uniqueItems: true
        deleteIsNotAllowedBefore:
          nullable: true
          type: string
        documentContentAsBase64:
          nullable: true
          type: string
        documentPreviewAsBase64:
          nullable: true
          type: string
        filename:
          nullable: true
          type: string
        groupOfBusinessOwner:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        importDate:
          nullable: true
          type: string
        isSoftDeleted:
          type: boolean
        metadataValues:
          additionalProperties:
            type: string
          description: 'The values this document holds for the custom metadata-fields
            defined at its containing storage-location, keyed by the field-definition-id.

            A boolean-value is represented as "true"/"false". A field for which the
            document has no value is absent from this dictionary.'
          nullable: true
          type: object
        mimeType:
          nullable: true
          type: string
        mustBeHardDeletedAfter:
          nullable: true
          type: string
        originalFilename:
          nullable: true
          type: string
        readableId:
          format: int64
          type: integer
        tags:
          items:
            $ref: '#/components/schemas/TagDTO'
          nullable: true
          type: array
          uniqueItems: true
        title:
          nullable: true
          type: string
        versionNumber:
          description: The incrementing version-number of this document within its
            version-chain (1-based).
          format: int32
          type: integer
        versionTimestamp:
          description: The moment this version was created, as a formatted string.
          nullable: true
          type: string
      type: object
    DocumentPreviewDTO:
      additionalProperties: false
      description: Represents a data transfer object for a document preview, without
        the full document content.
      properties:
        addedByUserId:
          nullable: true
          type: string
        aiSummaryShort:
          description: A very short AI-generated summary (at most three sentences)
            shown as a hint in listings, or null if none has been generated yet.
          nullable: true
          type: string
        assignedLanguages:
          items:
            type: string
          nullable: true
          type: array
          uniqueItems: true
        deleteIsNotAllowedBefore:
          nullable: true
          type: string
        filename:
          nullable: true
          type: string
        groupOfBusinessOwner:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        importDate:
          nullable: true
          type: string
        isSoftDeleted:
          type: boolean
        mimeType:
          nullable: true
          type: string
        mustBeHardDeletedAfter:
          nullable: true
          type: string
        originalFilename:
          nullable: true
          type: string
        previewAsBase64:
          nullable: true
          type: string
        readableId:
          format: int64
          type: integer
        title:
          nullable: true
          type: string
        versionNumber:
          description: The incrementing version-number of this document within its
            version-chain (1-based).
          format: int32
          type: integer
        versionTimestamp:
          description: The moment this version was created, as a formatted string.
          nullable: true
          type: string
      type: object
    FolderDTO:
      additionalProperties: false
      properties:
        containedDocumentIds:
          items:
            type: string
          nullable: true
          type: array
        containedFolderIds:
          items:
            type: string
          nullable: true
          type: array
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    GeneralSettingsDTO:
      additionalProperties: false
      description: Data transfer object for the general (admin-configurable) OpenDMS-settings.
      properties:
        autoGenerateAISummary:
          description: Whether an AI-summary is generated automatically whenever a
            document is added or changed.
          type: boolean
      type: object
    MetadataFieldDefinitionCreationDTO:
      additionalProperties: false
      description: Data transfer object used to create a new custom metadata-field-definition
        for a storage-location.
      properties:
        name:
          description: The display-name of the field to create.
          nullable: true
          type: string
        type:
          description: The value-type of the field ("String" or "Boolean").
          nullable: true
          type: string
      type: object
    MetadataFieldDefinitionDTO:
      additionalProperties: false
      description: Data transfer object for a storage-location-specific custom metadata-field-definition.
      properties:
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
        storageLocationId:
          nullable: true
          type: string
        type:
          description: The value-type of the field ("String" or "Boolean").
          nullable: true
          type: string
      type: object
    StorageLocationDTO:
      additionalProperties: false
      properties:
        containedDocumentIds:
          items:
            type: string
          nullable: true
          type: array
        containedFolderIds:
          items:
            type: string
          nullable: true
          type: array
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    StringValueDTO:
      additionalProperties: false
      properties:
        value:
          nullable: true
          type: string
      type: object
    TagDTO:
      additionalProperties: false
      properties:
        colorCode:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    UserInformationDTO:
      additionalProperties: false
      properties:
        id:
          nullable: true
          type: string
        isAdmin:
          type: boolean
        name:
          nullable: true
          type: string
      type: object
    UserOverviewDTO:
      additionalProperties: false
      description: Represents a user together with the names of the roles currently
        assigned to it. Used for the administrative user-overview.
      properties:
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
        roles:
          items:
            type: string
          nullable: true
          type: array
          uniqueItems: true
      type: object
info:
  description: OpenDMSBackend is the backend of OpenDMS.
  title: OpenDMSBackend v3.1.0 API documentation
  version: v3.1.0
openapi: 3.0.4
paths:
  /API/Other/Maintenance/AvailabilityCheck:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/CurrentVersion:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/HealthCheck:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/InitializationState:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/Metrics:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/ShowAllEndpoints:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/v3/OpenDMSBackend/AddDocument/{containerId}:
    post:
      parameters:
      - description: The ID of the container (folder or storage location) to add the
          document to.
        in: path
        name: containerId
        required: true
        schema:
          type: string
      - description: The file name for the uploaded document.
        in: query
        name: filename
        schema:
          type: string
      - description: An optional display title for the document.
        in: query
        name: title
        schema:
          type: string
      - description: Additional languages to use during OCR processing.
        in: query
        name: additionalOCRLanguages
        schema:
          items:
            type: string
          type: array
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              format: byte
              type: string
          application/json:
            schema:
              format: byte
              type: string
          application/octet-stream:
            schema:
              format: byte
              type: string
          text/json:
            schema:
              format: byte
              type: string
        description: The raw binary content of the document.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Uploads a new document into the specified container.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AddFolder/{parentFolderId}/{name}:
    post:
      parameters:
      - description: The ID of the parent folder in which to create the new folder.
        in: path
        name: parentFolderId
        required: true
        schema:
          type: string
      - description: The name of the new folder.
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Creates a new folder inside the specified parent folder.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AddModerator/{contentId}/{newModeratorUserId}:
    post:
      parameters:
      - description: The id of the content-object.
        in: path
        name: contentId
        required: true
        schema:
          type: string
      - description: The id of the user to add as a moderator.
        in: path
        name: newModeratorUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Adds the specified user as a moderator of the specified content-object
        (storage-location, folder or document). Only a moderator may do this. A content-object
        can have several moderators.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AddStorageLocation/{name}:
    post:
      parameters:
      - description: The display name of the new storage location.
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Creates a new storage location with the given name owned by the current
        user.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AuthorizeUserToEditStorageLocation/{storageLocationId}/{editUserId}:
    post:
      parameters:
      - description: The id of the storage location.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: The id of the user to grant the edit-permission to.
        in: path
        name: editUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Grants the specified user permission to change (edit) the specified
        storage location and its contents. Only a moderator (owner) of the storage-location
        may do this.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/AuthorizeUserToViewStorageLocation/{storageLocationId}/{sharedWithUserId}:
    post:
      parameters:
      - description: The id of the storage location to share.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: The id of the user to grant access to.
        in: path
        name: sharedWithUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Grants the specified user permission to view the specified storage
        location.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/DefineMetadataField/{storageLocationId}:
    post:
      parameters:
      - description: The id of the storage-location the field is defined for.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              $ref: '#/components/schemas/MetadataFieldDefinitionCreationDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataFieldDefinitionCreationDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/MetadataFieldDefinitionCreationDTO'
        description: The name and type ("String" or "Boolean") of the field to create.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Defines a new custom metadata-field for the specified storage-location.
        Only a moderator of the storage-location may do this.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GenerateAISummary/{documentId}:
    post:
      parameters:
      - description: The id of the document to summarize.
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
          description: OK
      summary: Generates the short and the long AI-summary of the specified document
        and returns the updated document.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetAllTags:
    put:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/TagDTO'
                type: array
          description: OK
      summary: Returns all tags defined in the system.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetAllViewableStorageLocations:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StorageLocationDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/StorageLocationDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/StorageLocationDTO'
                type: array
          description: OK
      summary: Returns all storage locations the current user is allowed to view.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetDocument:
    get:
      parameters:
      - description: The id of the document to retrieve.
        in: query
        name: id
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
          description: OK
      summary: Returns the full document with the specified id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetDocumentFromReadableId:
    get:
      parameters:
      - description: The human-readable numeric id of the document to retrieve.
        in: query
        name: readableId
        schema:
          format: int32
          type: integer
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
          description: OK
      summary: Returns the full document identified by its human-readable numeric
        id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetDocumentPreview:
    get:
      parameters:
      - description: The id of the document whose preview is requested.
        in: query
        name: id
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentPreviewDTO'
          description: OK
      summary: Returns a preview representation of the document with the specified
        id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetFolder/{id}:
    get:
      parameters:
      - description: The id of the folder to retrieve.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/FolderDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/FolderDTO'
          description: OK
      summary: Returns the folder with the specified id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetGeneralSettings:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettingsDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/GeneralSettingsDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/GeneralSettingsDTO'
          description: OK
      summary: Returns the general (admin-configurable) OpenDMS-settings.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetLatestDocuments:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
          description: OK
      summary: Returns the most recently added documents visible to the current user.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetMetadataFields/{storageLocationId}:
    get:
      parameters:
      - description: The id of the storage-location.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MetadataFieldDefinitionDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/MetadataFieldDefinitionDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/MetadataFieldDefinitionDTO'
                type: array
          description: OK
      summary: Returns all custom metadata-fields defined for the specified storage-location.
        The current user must be allowed to view the storage-location.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetModerators/{contentId}:
    get:
      parameters:
      - description: The id of the content-object.
        in: path
        name: contentId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
            text/json:
              schema:
                items:
                  type: string
                type: array
            text/plain:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Returns the ids of all moderators of the specified content-object.
        Only a moderator may query this.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetStorageLocation/{id}:
    get:
      parameters:
      - description: The id of the storage location to retrieve.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/StorageLocationDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/StorageLocationDTO'
          description: OK
      summary: Returns the storage location with the specified id.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/GetVersionHistory:
    get:
      parameters:
      - description: The ID of a document in the version-chain.
        in: query
        name: documentId
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
          description: OK
      summary: Returns the complete version-history (from oldest to newest) of the
        document's version-chain.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/HardDelete/{containerOrContaineeId}:
    delete:
      parameters:
      - description: The id of the container or document to delete.
        in: path
        name: containerOrContaineeId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
        description: The stated reason for the deletion, recorded in the audit log.
      responses:
        '200':
          description: OK
      summary: Permanently deletes the specified container or document and all its
        contents.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/Move/{containeeIdToMove}/{targetContainerId}:
    post:
      parameters:
      - description: The id of the document or folder to move.
        in: path
        name: containeeIdToMove
        required: true
        schema:
          type: string
      - description: The id of the container to move the item into.
        in: path
        name: targetContainerId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Moves the specified containee into the target container.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/RemoveDocumentMetadataValue/{documentId}/{fieldDefinitionId}:
    delete:
      parameters:
      - description: The id of the document.
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: The id of the metadata-field-definition.
        in: path
        name: fieldDefinitionId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Clears the value the specified document holds for the specified metadata-field.
        The current user must be allowed to change the document.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/RemoveMetadataField/{fieldDefinitionId}:
    delete:
      parameters:
      - description: The id of the field-definition to remove.
        in: path
        name: fieldDefinitionId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Removes the specified custom metadata-field-definition together with
        all values documents hold for it. Only a moderator of the field's storage-location
        may do this.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/RemoveModerator/{contentId}/{moderatorUserId}:
    post:
      parameters:
      - description: The id of the content-object.
        in: path
        name: contentId
        required: true
        schema:
          type: string
      - description: The id of the moderator to remove.
        in: path
        name: moderatorUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Removes the specified user from the moderators of the specified content-object.
        Only a moderator may do this. A folder or storage-location must always keep
        at least one moderator.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/Rename/{containerId}/{newName}:
    post:
      parameters:
      - description: The id of the container to rename.
        in: path
        name: containerId
        required: true
        schema:
          type: string
      - description: The new name to assign.
        in: path
        name: newName
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Renames the specified container to the given new name.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/Search:
    get:
      parameters:
      - description: The term to search for across document titles, filenames, tags,
          and OCR content.
        in: query
        name: searchTerm
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentPreviewDTO'
                type: array
          description: OK
      summary: Searches for documents visible to the current user that match the given
        search term.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/SetDocumentMetadataValue/{documentId}/{fieldDefinitionId}:
    post:
      parameters:
      - description: The id of the document.
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: The id of the metadata-field-definition.
        in: path
        name: fieldDefinitionId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
        description: The value to set. For a boolean-field the value must be parseable
          as a boolean.
      responses:
        '200':
          description: OK
      summary: Sets the value the specified document holds for the specified metadata-field.
        The current user must be allowed to change the document.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/SetGeneralSettings:
    put:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              $ref: '#/components/schemas/GeneralSettingsDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralSettingsDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/GeneralSettingsDTO'
        description: The new settings-values.
      responses:
        '200':
          description: OK
      summary: Updates the general (admin-configurable) OpenDMS-settings. Only administrators
        are allowed to call this.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/SoftDelete/{containerOrContaineeId}:
    delete:
      parameters:
      - description: The id of the container or document to soft-delete.
        in: path
        name: containerOrContaineeId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
        description: The stated reason for the deletion, recorded in the audit log.
      responses:
        '200':
          description: OK
      summary: Marks the specified container or document as soft-deleted without removing
        it from storage.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/UnauthorizeUserToEditStorageLocation/{storageLocationId}/{editUserId}:
    post:
      parameters:
      - description: The id of the storage location.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: The id of the user whose edit-permission should be revoked.
        in: path
        name: editUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Revokes the specified user's permission to change (edit) the specified
        storage location. Only a moderator (owner) of the storage-location may do
        this.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/UnauthorizeUserToViewStorageLocation/{storageLocationId}/{sharedWithUserId}:
    post:
      parameters:
      - description: The id of the storage location.
        in: path
        name: storageLocationId
        required: true
        schema:
          type: string
      - description: The id of the user whose access should be revoked.
        in: path
        name: sharedWithUserId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Revokes the specified user's permission to view the specified storage
        location.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/UpdateDocumentTitle/{documentId}:
    put:
      parameters:
      - description: The ID of the document whose title should be updated.
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
        description: The new title value to assign to the document.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Updates the display title of an existing document.
      tags:
      - OpenDMSBackend
  /API/v3/OpenDMSBackend/UploadNewVersion/{oldDocumentId}:
    post:
      parameters:
      - description: The ID of the document a new version is uploaded for.
        in: path
        name: oldDocumentId
        required: true
        schema:
          type: string
      - description: The file name for the uploaded document.
        in: query
        name: filename
        schema:
          type: string
      - description: An optional display title for the document.
        in: query
        name: title
        schema:
          type: string
      - description: Additional languages to use during OCR processing.
        in: query
        name: additionalOCRLanguages
        schema:
          items:
            type: string
          type: array
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              format: byte
              type: string
          application/json:
            schema:
              format: byte
              type: string
          application/octet-stream:
            schema:
              format: byte
              type: string
          text/json:
            schema:
              format: byte
              type: string
        description: The raw binary content of the new version.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Uploads a new version of an existing document. The new version is stored
        as a regular document in the same folder and is linked to the old document.
      tags:
      - OpenDMSBackend
  /API/v3/UserController/GetAllRoles:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
            text/json:
              schema:
                items:
                  type: string
                type: array
            text/plain:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Returns the names of all roles that can be assigned to a user. Requires
        administrator privileges.
      tags:
      - User
  /API/v3/UserController/GetAllUsers:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOverviewDTO'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOverviewDTO'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/UserOverviewDTO'
                type: array
          description: OK
      summary: Returns all users together with the roles assigned to them. Requires
        administrator privileges.
      tags:
      - User
  /API/v3/UserController/GetRoles:
    put:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
            text/json:
              schema:
                items:
                  type: string
                type: array
            text/plain:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Returns the roles assigned to the currently authenticated user.
      tags:
      - User
  /API/v3/UserController/GetTheme:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValueDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/StringValueDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/StringValueDTO'
          description: OK
      summary: Returns the color-scheme which the currently authenticated user chose.
      tags:
      - User
  /API/v3/UserController/GetUserInformation:
    get:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInformationDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserInformationDTO'
            text/plain:
              schema:
                $ref: '#/components/schemas/UserInformationDTO'
          description: OK
      summary: Returns profile information for the currently authenticated user.
      tags:
      - User
  /API/v3/UserController/Login:
    put:
      parameters:
      - description: The username.
        in: header
        name: user
        schema:
          type: string
      - description: The plain-text password.
        in: header
        name: password
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
            text/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
            text/plain:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: OK
      summary: Authenticates a user with the given credentials and returns an access
        token on success.
      tags:
      - User
  /API/v3/UserController/Logout:
    put:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Invalidates the current session's access token, logging the user out.
      tags:
      - User
  /API/v3/UserController/Register:
    put:
      parameters:
      - description: The username for the new account.
        in: header
        name: user
        schema:
          type: string
      - description: The plain-text password for the new account.
        in: header
        name: password
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Registers a new user account. Requires administrator privileges.
      tags:
      - User
  /API/v3/UserController/SetRolesOfUser:
    put:
      parameters:
      - description: The id of the user whose roles should be set.
        in: header
        name: userId
        schema:
          type: string
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              items:
                type: string
              type: array
          application/json:
            schema:
              items:
                type: string
              type: array
          text/json:
            schema:
              items:
                type: string
              type: array
        description: The names of the roles the user should have afterwards.
      responses:
        '200':
          description: OK
      summary: Sets the complete set of roles of the given user (roles not contained
        are removed, missing ones are added). Requires administrator privileges.
      tags:
      - User
  /API/v3/UserController/SetTheme:
    put:
      parameters:
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/StringValueDTO'
        description: 'The color-scheme to store: "system", "light" or "dark".'
      responses:
        '200':
          description: OK
      summary: Sets the color-scheme of the currently authenticated user, so that
        the choice is available again on another device and after a new login.
      tags:
      - User
  /API/v3/UserController/TokenIsValid:
    get:
      parameters:
      - description: The access token to validate.
        in: header
        name: accessToken
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
            text/plain:
              schema:
                type: boolean
          description: OK
      summary: Checks whether the given access token is currently valid.
      tags:
      - User
tags:
- name: MaintenanceRoutes
- name: OpenDMSBackend
- name: User
