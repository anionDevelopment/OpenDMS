components:
  schemas:
    AccessToken:
      additionalProperties: false
      properties:
        expiredMoment:
          format: date-time
          type: string
        ownerUserId:
          nullable: true
          type: string
        value:
          nullable: true
          type: string
      type: object
    DocumentDTO:
      additionalProperties: false
      properties:
        assignedLanguages:
          items:
            type: string
          nullable: true
          type: array
          uniqueItems: true
        deleteIsNotAllowedBefore:
          nullable: true
          type: string
        documentContentAsBase64:
          nullable: true
          type: string
        documentPreviewAsBase64:
          nullable: true
          type: string
        filename:
          nullable: true
          type: string
        groupOfBusinessOwner:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        importDate:
          nullable: true
          type: string
        isSoftDeleted:
          type: boolean
        lastEditDate:
          nullable: true
          type: string
        mimeType:
          nullable: true
          type: string
        mustBeHardDeletedAfter:
          nullable: true
          type: string
        originalFilename:
          nullable: true
          type: string
        readableId:
          format: int64
          type: integer
        tags:
          items:
            $ref: '#/components/schemas/TagDTO'
          nullable: true
          type: array
          uniqueItems: true
        title:
          nullable: true
          type: string
        version:
          $ref: '#/components/schemas/Version3'
      type: object
    DocumentPreviewDTO:
      additionalProperties: false
      properties:
        assignedLanguages:
          items:
            type: string
          nullable: true
          type: array
          uniqueItems: true
        deleteIsNotAllowedBefore:
          nullable: true
          type: string
        filename:
          nullable: true
          type: string
        groupOfBusinessOwner:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        importDate:
          nullable: true
          type: string
        isSoftDeleted:
          type: boolean
        lastEditDate:
          nullable: true
          type: string
        mimeType:
          nullable: true
          type: string
        mustBeHardDeletedAfter:
          nullable: true
          type: string
        originalFilename:
          nullable: true
          type: string
        previewAsBase64:
          nullable: true
          type: string
        readableId:
          format: int64
          type: integer
        title:
          nullable: true
          type: string
        version:
          $ref: '#/components/schemas/Version3'
      type: object
    FolderDTO:
      additionalProperties: false
      properties:
        containedDocumentIds:
          items:
            type: string
          nullable: true
          type: array
        containedFolderIds:
          items:
            type: string
          nullable: true
          type: array
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    StorageLocationDTO:
      additionalProperties: false
      properties:
        containedDocumentIds:
          items:
            type: string
          nullable: true
          type: array
        containedFolderIds:
          items:
            type: string
          nullable: true
          type: array
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    TagDTO:
      additionalProperties: false
      properties:
        colorCode:
          nullable: true
          type: string
        id:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    UserInformationDTO:
      additionalProperties: false
      properties:
        id:
          nullable: true
          type: string
        isAdmin:
          type: boolean
        name:
          nullable: true
          type: string
      type: object
    Version3:
      additionalProperties: false
      properties:
        major:
          format: int64
          type: integer
        minor:
          format: int64
          type: integer
        patch:
          format: int64
          type: integer
      type: object
info:
  description: OpenDMSBackend is the backend of OpenDMS.
  title: OpenDMSBackend v1.1.4 API documentation
  version: v1.1.4
openapi: 3.0.4
paths:
  /API/Other/Maintenance/AvailabilityCheck:
    get:
      responses:
        '200':
          description: OK
      tags:
      - MaintenanceRoutes
  /API/Other/Maintenance/CurrentVersion:
