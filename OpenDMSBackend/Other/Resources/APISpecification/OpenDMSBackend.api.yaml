  /API/v1/OpenDMSBackend/AddDocument/{containerId}:
    post:
      parameters:
      - in: path
        name: containerId
        required: true
        schema:
          type: string
      - in: query
        name: filename
        schema:
          type: string
      - in: query
        name: title
        schema:
          type: string
      - in: query
        name: additionalOCRLanguages
        schema:
          items:
            type: string
          type: array
      - description: Access Token
        in: header
        name: X-AccessToken
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/*+json:
            schema:
              format: byte
              type: string
          application/json:
            schema:
              format: byte
              type: string
          application/octet-stream:
            schema:
              format: byte
              type: string
          text/json:
            schema:
              format: byte
              type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      tags:
      - OpenDMSBackend
  /API/v1/OpenDMSBackend/AddFolder/{parentFolderId}/{name}:
    post:
